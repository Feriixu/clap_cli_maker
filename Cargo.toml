[package]
name = "clap_cli_maker"
version = "1.0.0"
edition = "2024"
description = "A desktop app (egui/eframe) for visual design of a clap derive-style CLI, generating matching Rust struct/enum definitions."
license = "GPL-3.0-or-later"
keywords = ["clap", "cli", "codegen", "gui", "egui"]

[dependencies]
dirs = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
egui_code_editor = "0.3.7"
heck = "0.5.0"
opener = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
